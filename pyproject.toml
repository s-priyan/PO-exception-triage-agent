[project]
name = "asos"
version = "0.1.0"
description = "A two-stage LangGraph agent for merchandising PO exception triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.28",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.1.0",
    "transformers>=4.51.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]
